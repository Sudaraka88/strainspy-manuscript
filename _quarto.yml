project:
  type: website
  output-dir: docs
  render:
    - "*.Rmd"

execute:
  freeze: auto

knitr:
  opts_chunk:
    fig.width: 12
    fig.height: 8
    fig.align: center
    out.width: "100%"

website:
  title: "StrainSpy Manuscript"

  navbar:
    logo: assets/icon.svg

    left:
      - href: index.Rmd
        text: Home
      - href: methods.Rmd
        text: Methods & Simulations
      - href: associations.Rmd
        text: Association Testing
      - href: prediction.Rmd
        text: Prediction

  sidebar:
    style: docked
    search: true

    contents:
      - section: "Home"
        contents:
          - index.Rmd

      - section: "Methods & Simulations"
        contents:
          - methods.Rmd
          - simulations.Rmd
          - Sims_spike_query.Rmd
          - Sims_spike_profile.Rmd
          - sims_spike_query_pdis.Rmd
          - prior_on_dispersion.Rmd
          - logistic_ID.Rmd
          - varyingPrior.Rmd
          - aniAdjust.Rmd

      - section: "Association Testing"
        contents:
          - palleja_Ab_analysis.Rmd
          - CRC_pooled.Rmd
          - immunotherapy_assoc.Rmd

      - section: "Prediction"
        contents:
          - pred_CRC_lodo+single.Rmd
          - immunotherapy_preds.Rmd

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    code-summary: "Show code"

    filters:
      - collapse-output

    css:
      - resources.css

    include-after-body:
      - text: |
          <script>
          document.addEventListener("DOMContentLoaded", function () {
            const toc = document.querySelector("#TOC");

            if (!toc) return;

            const resources = document.createElement("div");
            resources.className = "strainspy-resources";

            resources.innerHTML = `
              <div class="strainspy-resources-title">Resources</div>

              <a href="https://github.com/gtonkinhill/strainspy"
                 target="_blank"
                 rel="noopener noreferrer"
                 class="strainspy-resource">
                <i class="bi bi-github"></i>
                <span>
                  <strong>StrainSpy</strong>
                  <small>GitHub repository</small>
                </span>
              </a>

              <a href="https://github.com/Sudaraka88/strainspy-manuscript"
                 target="_blank"
                 rel="noopener noreferrer"
                 class="strainspy-resource">
                <i class="bi bi-github"></i>
                <span>
                  <strong>Analysis repository</strong>
                  <small>Code and analyses</small>
                </span>
              </a>
            `;
            
            toc.appendChild(resources);
          });
          </script>